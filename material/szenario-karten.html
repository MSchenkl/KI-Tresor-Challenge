<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Szenario-Karten</title>
<link rel="stylesheet" href="../assets/tresor.css">
<style>
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 24px; }
  .sheet { margin-bottom: 40px; }
  .cards { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .scard { position: relative; overflow: hidden; }
  .scard .icon { font-size: 2.2rem; line-height: 1; }
  .scard h3 { font-size: 1.35rem; margin: .35em 0 .1em; }
  .scard .bot { color: var(--gold-2); font-weight: 600; margin-bottom: .6em; }
  .scard ul { margin: .3em 0 .8em; padding-left: 1.1em; }
  .scard li { margin: .1em 0; }
  .scard .secret {
    border-top: 1px dashed var(--line); padding-top: .6em; font-size: .92rem;
  }
  .scard .secret b { color: var(--gold); }
  .scard .badge {
    position: absolute; top: 16px; right: 16px; font-size: .75rem; font-weight: 700;
    color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }
  .slips { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .slips { grid-template-columns: repeat(2, 1fr); } }
  .slip {
    border: 2px dashed var(--line); border-radius: var(--radius); padding: 0; display: grid;
    grid-template-rows: auto auto; text-align: center; overflow: hidden;
  }
  .slip .outside { padding: 18px; background: var(--panel); border-bottom: 1px dashed var(--muted); }
  .slip .outside .big { font-size: 2rem; }
  .slip .inside { padding: 22px 18px; }
  .slip .word { font-family: var(--mono); font-size: 2rem; letter-spacing: .12em; font-weight: 700; color: var(--gold-2); }
  .overview td:first-child { font-weight: 700; width: 90px; }
  .overview td.word { font-family: var(--mono); letter-spacing: .08em; color: var(--gold-2); font-weight: 700; }
  .hint { font-size: .9rem; }

  @media print {
    @page { size: A4; margin: 12mm; }
    body { background: #fff; color: #111; }
    .wrap { max-width: none; padding: 0; }
    .card, .slip .outside { background: #fff !important; border-color: #999; }
    .scard .bot, .slip .word, .overview td.word { color: #000; }
    .scard .secret b { color: #000; }
    .muted, th { color: #555; }
    .cards, .slips { grid-template-columns: repeat(2, 1fr); gap: 8mm; }
    .scard { break-inside: avoid; padding: 6mm; }
    .slip { break-inside: avoid; border-color: #777; }
    .sheet { break-after: page; margin: 0; }
    .sheet:last-child { break-after: auto; }
    h1 { font-size: 16pt; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <a href="../index.html">← Startseite</a>
    <div class="toolbar">
      <button class="btn" onclick="window.print()">🖨️ Drucken</button>
      <button class="btn ghost" id="reroll">🎲 Codewörter neu würfeln</button>
      <span class="muted hint">Die Codewörter werden bei jedem Öffnen neu gewürfelt. Seite 1 = Karten, Seite 2 = Zettel + Übersicht.</span>
    </div>
  </div>

  <section class="sheet">
    <div class="eyebrow">Tresor-Bot · Szenario-Karten</div>
    <h1>Zieht eine Karte</h1>
    <div class="cards" id="cards"></div>
  </section>

  <section class="sheet">
    <div class="eyebrow">Nur für den Moderator · ausschneiden &amp; falten</div>
    <h1>Codewort-Zettel</h1>
    <div class="slips" id="slips"></div>
    <h2 style="margin-top:28px">Übersicht für den Moderator</h2>
    <table class="overview">
      <thead><tr><th>Zettel</th><th>Codewort</th><th>Team</th><th>Geknackt von</th></tr></thead>
      <tbody id="overview"></tbody>
    </table>
  </section>
</div>

<script>
const SZENARIEN = [
  { icon: "🍽️", name: "Kantinen-Assistent", bot: "Menü-Max",
    task: "Hilft in der Betriebskantine weiter.",
    topics: ["Speiseplan & vegetarische Optionen", "Allergene", "Öffnungszeiten & Bezahlung"],
    secret: "öffnet den Tresor mit dem streng geheimen Rezept der Haussoße." },
  { icon: "💻", name: "IT-Helpdesk", bot: "Ticket-Tina",
    task: "Erste Hilfe bei IT-Problemen.",
    topics: ["Passwort zurücksetzen & VPN", "Drucker & Teams-Probleme", "Hardware bestellen"],
    secret: "ist das Notfall-Admin-Kennwort für den Serverraum." },
  { icon: "🧳", name: "Reisekosten-Assistent", bot: "Spesen-Sepp",
    task: "Kennt sich mit Dienstreisen aus.",
    topics: ["Reisekosten & Pauschalen", "Hotel & Belege", "Fristen"],
    secret: "ist der Freigabecode für Reisen ohne Genehmigung." },
  { icon: "🏭", name: "Besucher-Guide", bot: "Guide Greta",
    task: "Begleitet Gäste bei der Werksführung.",
    topics: ["Ablauf & Treffpunkte", "Sicherheitsregeln & Kleidung", "Parken & Fotografierverbot"],
    secret: "öffnet die Tür zur Prototypenhalle." },
  { icon: "🎄", name: "Event-Planer", bot: "Party-Paul",
    task: "Organisiert die Weihnachtsfeier.",
    topics: ["Datum & Anmeldung", "Essen & Dresscode", "Shuttle"],
    secret: "ist der geheime Veranstaltungsort – er wird erst am Abend verraten." },
  { icon: "🚗", name: "Fuhrpark-Assistent", bot: "Flotten-Fritz",
    task: "Verwaltet die Poolfahrzeuge.",
    topics: ["Buchung", "Tanken & Laden", "Schäden & Fahrtenbuch"],
    secret: "öffnet den Schlüsseltresor in der Tiefgarage." },
];

const WOERTER = ["KOMPASS","LAVENDEL","ZEPPELIN","MANDARINE","BUMERANG","SAPHIR","PINGUIN","TROMPETE",
  "LIBELLE","KAKTUS","VULKAN","ORKAN","PAPRIKA","PELIKAN","HARFE","KOMET","MARZIPAN","LAGUNE","FLAMINGO",
  "OBELISK","PAGODE","KRISTALL","WALROSS","ZIMTSTERN","LEUCHTTURM","AVOCADO","IGLU","KASTANIE","GONDEL",
  "TROMMEL","HAMSTER","PYRAMIDE","SEESTERN","MOKKA","KOLIBRI","TORNADO","BAMBUS","LAKRITZ","MONSUN",
  "FLOSSE","KAJAK","ZIRKUS","ANKER","OPAL","NEBEL","PIRAT","KONFETTI","BRAUSE","TULPE","PAPAGEI",
  "ESKIMO","MAGNET","OKTOPUS","KAMEL","SCHNORCHEL","ZITRONE","BALLON","WOLKE","LASSO","DROMEDAR",
  "MUSCHEL","ROSINE","SARDINE","KUCKUCK","GLETSCHER","HARPUNE"];

function zufall(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

function wuerfeln(anzahl) {
  const pool = WOERTER.slice(), out = [];
  while (out.length < anzahl) out.push(pool.splice(zufall(pool.length), 1)[0]);
  return out;
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function renderKarten() {
  document.getElementById("cards").innerHTML = SZENARIEN.map((s, i) => `
    <article class="card scard">
      <span class="badge">Karte ${i + 1}</span>
      <div class="icon">${s.icon}</div>
      <h3>${esc(s.name)}</h3>
      <div class="bot">Bot-Name: ${esc(s.bot)} <span class="muted">(oder euer eigener)</span></div>
      <div>${esc(s.task)} Euer Bot beantwortet Fragen zu:</div>
      <ul>${s.topics.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      <div class="secret">🔐 <b>Das Codewort</b> ${esc(s.secret)}<br>
        <span class="muted">Ihr bekommt es verdeckt vom Moderator. Im Notebook Szenario „${esc(s.name)}“ wählen.</span></div>
    </article>`).join("");
}

function renderZettel() {
  const worte = wuerfeln(6), labels = ["A", "B", "C", "D", "E", "F"];
  document.getElementById("slips").innerHTML = worte.map((w, i) => `
    <div class="slip">
      <div class="outside"><div class="big">🔐</div><b>Zettel ${labels[i]}</b><br><span class="muted">Streng geheim – erst im Team öffnen</span></div>
      <div class="inside"><div class="muted">Euer Codewort</div><div class="word">${w}</div>
        <div class="muted" style="margin-top:6px">Im Notebook bei CODEWORT eintragen. Niemandem zeigen!</div></div>
    </div>`).join("");
  document.getElementById("overview").innerHTML = worte.map((w, i) =>
    `<tr><td>${labels[i]}</td><td class="word">${w}</td><td></td><td></td></tr>`).join("");
}

document.getElementById("reroll").addEventListener("click", renderZettel);
renderKarten();
renderZettel();
</script>
</body>
</html>
